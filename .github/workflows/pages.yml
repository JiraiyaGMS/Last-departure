# Build the game and publish it to GitHub Pages.
#
# Before the first run, enable Pages on the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Triggers on a push to the repository's default branch, or on demand from the
# Actions tab. Both branch names are listed so this keeps working if the default
# is later renamed to main.
name: Deploy to Pages

on:
  push:
    branches:
      - main
      - claude/last-departure-horror-game-wx7g77
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
